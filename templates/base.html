<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zakiya Scents — Artisan Perfumery{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand fs-4" href="{{ url_for('beranda') }}">
                ✨ Zakiya Scents
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-1 mt-2 mt-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('beranda') }}">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('list_produk') }}">Koleksi Parfum</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('form_cek') }}">Cek Member</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('tentang') }}">Tentang Brand</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('kontak') }}">Kontak</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="main-wrapper">
        <div class="container">
            <!-- Wrapper Animasi Transisi Halaman -->
            <div id="pageWrapper" class="custom-card page-transition">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white-50 text-center py-4 mt-auto">
        <div class="container">
            <small>&copy; 2026 <strong>Zakiya Scents</strong> — Artisan Fragrance Boutique. Built with Flask & Jinja2.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
